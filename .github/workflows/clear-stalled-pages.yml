name: Clear stalled Pages status report
on:
  push:
    paths: ['.github/workflows/clear-stalled-pages.yml']
permissions:
  actions: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete status report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/dowonkyung/angangjin/actions/runs/39038330514/cancel --method POST
